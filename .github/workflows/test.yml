name: Tests

on:
  # Any PR (not only base=main) so feature-branch stacks still get the
  # frontend typecheck/build gate that would have caught bare queryFn
  # mismatches like listEpisodes(notebookId?) vs React Query context.
  pull_request:
  push:
    branches: [install]
  # On-demand runs for any branch without opening a PR.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-guards:
    name: Approved Git guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prove the checked-in approved hook blocks
        run: |
          set -euo pipefail
          bash -n .githooks/pre-commit
          git config --local core.hooksPath .githooks
          # Assemble a synthetic token shape at runtime: no credential value is
          # stored in this workflow, and hook output is suppressed.
          printf 'github_%s_%s\n' 'pat' 'AAAAAAAAAAAAAAAAAAAAAAAA' > .ci-hook-selftest.txt
          git add -f .ci-hook-selftest.txt
          if git hook run pre-commit >/dev/null 2>&1; then
            echo "::error::approved secret guard did not block its self-test"
            exit 1
          fi

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      # Podcast transcript-quality tests probe real audio via ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=open_notebook --cov=api --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: coverage.xml

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run ruff
        run: uv run ruff check .

  backend-typecheck:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: uv run python -m mypy .

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fail fast with tsc diagnostics before Next's bundled typecheck.
      # Catches React Query queryFn signature mismatches that only show up
      # once an API method gains an optional first param.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  release-gate-scripts:
    name: Release Gate Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Syntax-check release image gate
        run: |
          bash -n scripts/release-test/release-image-test.sh
          bash -n scripts/release-test/rc-stack.sh
          test -f scripts/release-test/docker-compose.release-test.yml
          test -x scripts/release-test/release-image-test.sh || chmod +x scripts/release-test/release-image-test.sh

      - name: Document full image gate (not on every PR)
        run: |
          echo "Full fresh+upgrade image gate remains maintainer/release path:"
          echo "  make release-test  # or scripts/release-test/release-image-test.sh"
          echo "Wire a scheduled/manual workflow when registry credentials are available."
